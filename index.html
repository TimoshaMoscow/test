<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кнопочный телефон · Симулятор набора</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', 'Nokia Pure', 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #2b2b2b 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* КОРПУС ТЕЛЕФОНА */
    .phone {
      background: #3a3a3a;
      background: linear-gradient(145deg, #3e3e3e, #2c2c2c);
      width: 340px;
      padding: 20px 15px 25px;
      border-radius: 38px;
      box-shadow: 
        0 18px 25px rgba(0,0,0,0.7),
        inset 0 1px 4px rgba(255,255,255,0.2),
        inset 0 -3px 8px rgba(0,0,0,0.6);
      border: 1px solid #555;
    }

    /* ЭКРАН */
    .screen {
      background: #b8d4b0; /* старый LCD зеленоватый */
      background: linear-gradient(145deg, #c0dab6, #a6c29c);
      border-radius: 16px;
      padding: 16px 12px 12px;
      margin-bottom: 20px;
      box-shadow: 
        inset 0 0 0 2px #6d7a62,
        inset 0 6px 10px rgba(0,0,0,0.25),
        0 2px 4px rgba(0,0,0,0.5);
      border: 1px solid #7d8a72;
    }

    .display-text {
      background: #9fb896;
      background: linear-gradient(145deg, #b1cba7, #9cb392);
      border-radius: 8px;
      padding: 14px 12px;
      min-height: 80px;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #1f3a1a;
      text-shadow: 0 1px 0 #d0e8c6;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
      word-break: break-word;
      display: flex;
      align-items: center;
      border: 1px solid #7a8f70;
      font-family: 'Courier New', 'Nokia Pure', monospace;
      transition: all 0.1s;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 13px;
      color: #2b4423;
      font-weight: 600;
      text-shadow: 0 1px 0 #bcd6b0;
      padding: 0 4px;
    }

    .battery {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .battery-icon {
      width: 22px;
      height: 12px;
      background: #3d5834;
      border-radius: 2px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }

    .battery-icon::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 3px;
      width: 3px;
      height: 6px;
      background: #3d5834;
      border-radius: 0 2px 2px 0;
    }

    .battery-level {
      width: 16px;
      height: 8px;
      background: #4a7940;
      border-radius: 1px;
      margin: 2px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
    }

    /* КЛАВИАТУРА */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .key {
      background: #4a4a4a;
      background: radial-gradient(circle at 30% 20%, #5e5e5e, #3a3a3a);
      border: none;
      border-radius: 18px;
      padding: 12px 0 10px;
      color: #ececec;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 2px 0 #1f1f1f;
      box-shadow: 
        0 6px 0 #1f1f1f,
        0 8px 8px rgba(0,0,0,0.5),
        inset 0 1px 3px rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.06s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      font-family: 'Segoe UI', 'Nokia Pure', sans-serif;
      letter-spacing: 1px;
      transform: translateY(-2px);
    }

    .key:active, .key.pressed {
      transform: translateY(4px);
      box-shadow: 
        0 2px 0 #1f1f1f,
        0 4px 8px rgba(0,0,0,0.5),
        inset 0 1px 2px rgba(255,255,255,0.3);
    }

    .key .sub {
      font-size: 12px;
      font-weight: 400;
      color: #b0b0b0;
      letter-spacing: 2px;
      margin-top: 2px;
      text-shadow: 0 1px 0 #111;
      font-family: 'Courier New', monospace;
    }

    /* СПЕЦИАЛЬНЫЕ КЛАВИШИ (нижний ряд) */
    .bottom-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .key.small {
      font-size: 18px;
      padding: 12px 0 10px;
      border-radius: 16px;
      background: radial-gradient(circle at 30% 20%, #5a5a5a, #363636);
    }

    .key.small .sub {
      font-size: 10px;
      margin-top: 0;
    }

    /* кнопка очистки/удаления */
    .key.clear {
      background: radial-gradient(circle at 30% 20%, #6d4b4b, #3d2a2a);
      color: #ffc9c9;
    }

    .key.clear:active {
      background: radial-gradient(circle at 30% 20%, #8a5a5a, #4a2e2e);
    }

    /* анимация нажатия */
    .key.pressed {
      transition: all 0.05s;
    }

    /* подсказка */
    .hint {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.7;
    }

    /* небольшая вибрация (эмуляция) */
    @keyframes vibrate {
      0% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
      75% { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }

    .phone.vibrate {
      animation: vibrate 0.1s ease;
    }

    /* адаптив */
    @media (max-width: 380px) {
      .phone { width: 300px; padding: 15px 10px 20px; }
      .key { font-size: 24px; padding: 10px 0 8px; }
      .key .sub { font-size: 10px; }
      .display-text { font-size: 22px; min-height: 70px; }
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <!-- ЭКРАН -->
    <div class="screen">
      <div class="display-text" id="display">Привет</div>
      <div class="status-bar">
        <span>📶 MTS</span>
        <div class="battery">
          <span>🔋</span>
          <div class="battery-icon">
            <div class="battery-level"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- КЛАВИАТУРА (3x4) -->
    <div class="keypad">
      <!-- 1 -->
      <button class="key" data-key="1" data-letters=".,?!1">
        <span>1</span>
        <span class="sub">.,?!</span>
      </button>
      <!-- 2 -->
      <button class="key" data-key="2" data-letters="абвг2">
        <span>2</span>
        <span class="sub">абвг</span>
      </button>
      <!-- 3 -->
      <button class="key" data-key="3" data-letters="дежз3">
        <span>3</span>
        <span class="sub">дежз</span>
      </button>
      <!-- 4 -->
      <button class="key" data-key="4" data-letters="ийкл4">
        <span>4</span>
        <span class="sub">ийкл</span>
      </button>
      <!-- 5 -->
      <button class="key" data-key="5" data-letters="мноп5">
        <span>5</span>
        <span class="sub">мноп</span>
      </button>
      <!-- 6 -->
      <button class="key" data-key="6" data-letters="рсту6">
        <span>6</span>
        <span class="sub">рсту</span>
      </button>
      <!-- 7 -->
      <button class="key" data-key="7" data-letters="фхцч7">
        <span>7</span>
        <span class="sub">фхцч</span>
      </button>
      <!-- 8 -->
      <button class="key" data-key="8" data-letters="шщъы8">
        <span>8</span>
        <span class="sub">шщъы</span>
      </button>
      <!-- 9 -->
      <button class="key" data-key="9" data-letters="ьэюя9">
        <span>9</span>
        <span class="sub">ьэюя</span>
      </button>
    </div>

    <!-- НИЖНИЙ РЯД: *, 0, # -->
    <div class="bottom-row">
      <button class="key small" data-key="*" data-letters="*+">
        <span>*</span>
        <span class="sub">+</span>
      </button>
      <button class="key small" data-key="0" data-letters=" 0">
        <span>0</span>
        <span class="sub">␣</span>
      </button>
      <button class="key small" data-key="#" data-letters="#">
        <span>#</span>
        <span class="sub">⇧</span>
      </button>
    </div>

    <!-- ДОПОЛНИТЕЛЬНЫЕ КНОПКИ (удаление, сброс) -->
    <div class="bottom-row" style="margin-top: 12px; grid-template-columns: 1fr 1fr;">
      <button class="key small clear" id="backspaceBtn">
        <span>⌫</span>
        <span class="sub">удалить</span>
      </button>
      <button class="key small clear" id="resetBtn">
        <span>✕</span>
        <span class="sub">сброс</span>
      </button>
    </div>

    <div class="hint">T9 · Нажимай многократно</div>
  </div>

  <script>
    (function(){
      // ---------- ДАННЫЕ ----------
      // Соответствие цифр и символов (циклический перебор)
      const keyMap = {
        '1': ['.', ',', '?', '!', '1'],
        '2': ['а', 'б', 'в', 'г', '2'],
        '3': ['д', 'е', 'ж', 'з', '3'],
        '4': ['и', 'й', 'к', 'л', '4'],
        '5': ['м', 'н', 'о', 'п', '5'],
        '6': ['р', 'с', 'т', 'у', '6'],
        '7': ['ф', 'х', 'ц', 'ч', '7'],
        '8': ['ш', 'щ', 'ъ', 'ы', '8'],
        '9': ['ь', 'э', 'ю', 'я', '9'],
        '*': ['*', '+'],
        '0': [' ', '0'],
        '#': ['#']
      };

      // Текущий текст (изначально "Привет" для примера)
      let currentText = 'Привет';
      
      // Состояние для многократного нажатия:
      let lastKey = null;          // какая клавиша была нажата последней
      let pressCount = 0;         // сколько раз подряд нажата
      let lastIndex = 0;          // текущий индекс в массиве символов (для быстрого доступа)
      let lastChar = '';          // последний добавленный символ (для замены)

      // Таймер для сброса счетчика (если долго не жмут)
      let resetTimer = null;
      const RESET_TIMEOUT = 1000; // 1 секунда — сбрасываем счетчик

      // DOM элементы
      const displayEl = document.getElementById('display');
      const phoneEl = document.getElementById('phone');
      const backspaceBtn = document.getElementById('backspaceBtn');
      const resetBtn = document.getElementById('resetBtn');

      // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
      function updateDisplay() {
        displayEl.textContent = currentText;
        // небольшой эффект мигания при обновлении (опционально)
        displayEl.style.transition = 'none';
        displayEl.style.transform = 'scale(0.98)';
        setTimeout(() => {
          displayEl.style.transition = 'all 0.1s';
          displayEl.style.transform = 'scale(1)';
        }, 20);
      }

      // Визуальная вибрация корпуса (симуляция)
      function vibratePhone() {
        phoneEl.classList.add('vibrate');
        setTimeout(() => {
          phoneEl.classList.remove('vibrate');
        }, 100);
      }

      // Сброс состояния многократного нажатия
      function resetPressState() {
        lastKey = null;
        pressCount = 0;
        lastIndex = 0;
        lastChar = '';
        if (resetTimer) {
          clearTimeout(resetTimer);
          resetTimer = null;
        }
      }

      // Запуск таймера сброса (сбрасывает счетчик через RESET_TIMEOUT)
      function restartResetTimer() {
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          // по истечении времени просто сбрасываем состояние,
          // но символ уже вставлен, ничего не удаляем
          resetPressState();
        }, RESET_TIMEOUT);
      }

      // ---------- ЛОГИКА ВВОДА ----------
      function handleKeyPress(key) {
        // Если нажата другая клавиша — сбрасываем счетчик
        if (lastKey !== key) {
          resetPressState();
          lastKey = key;
          pressCount = 0;
        }

        // Спецсимволы: * и # не имеют многократного ввода, но обрабатываем как обычно
        // (но для * и # массив короткий, всё равно работает)
        const chars = keyMap[key];
        if (!chars) return;

        // Увеличиваем счетчик нажатий
        pressCount++;

        // Если превысили длину массива — начинаем сначала (циклично)
        if (pressCount > chars.length) {
          pressCount = 1;
        }

        // Определяем индекс символа (pressCount - 1)
        const charIndex = pressCount - 1;
        const newChar = chars[charIndex];

        // ----- ЛОГИКА ЗАМЕНЫ -----
        // Если мы в процессе многократного нажатия одной и той же клавиши
        // и уже добавляли символ от этой клавиши, то нужно заменить последний символ.
        if (lastChar !== '' && lastKey === key && pressCount > 1) {
          // Удаляем последний символ (который был добавлен предыдущим нажатием)
          if (currentText.length > 0) {
            // Проверяем, что последний символ в тексте действительно lastChar
            // (на случай ручного удаления, но мы контролируем)
            if (currentText.endsWith(lastChar)) {
              currentText = currentText.slice(0, -lastChar.length);
            } else {
              // Если что-то пошло не так — просто удалим последний символ
              currentText = currentText.slice(0, -1);
            }
          }
          // Теперь добавляем новый символ
          currentText += newChar;
        } else {
          // Обычное добавление (первое нажатие или другая клавиша)
          // Но если lastChar не пуст и клавиша та же, но pressCount == 1 (после сброса)
          // или другая клавиша — просто добавляем
          currentText += newChar;
        }

        // Обновляем lastChar для следующего нажатия
        lastChar = newChar;
        lastIndex = charIndex;

        // Обновляем дисплей
        updateDisplay();
        vibratePhone();

        // Перезапускаем таймер сброса
        restartResetTimer();
      }

      // ---------- УДАЛЕНИЕ ПОСЛЕДНЕГО СИМВОЛА (BACKSPACE) ----------
      function handleBackspace() {
        if (currentText.length > 0) {
          currentText = currentText.slice(0, -1);
          updateDisplay();
          vibratePhone();
        }
        // Сбрасываем состояние многократного нажатия, чтобы не путаться
        resetPressState();
      }

      // ---------- ПОЛНЫЙ СБРОС ----------
      function handleReset() {
        currentText = '';
        updateDisplay();
        vibratePhone();
        resetPressState();
      }

      // ---------- НАЗНАЧЕНИЕ ОБРАБОТЧИКОВ НА КЛАВИШИ ----------
      const keys = document.querySelectorAll('.key[data-key]');
      keys.forEach(btn => {
        // Убираем data-key из backspace/reset, у них нет data-key
        const key = btn.getAttribute('data-key');
        if (!key) return;

        // Обработчик нажатия
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          handleKeyPress(key);
        });

        // Для предотвращения двойного срабатывания на тач-устройствах
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          // эмуляция нажатия для визуала
          btn.classList.add('pressed');
          setTimeout(() => btn.classList.remove('pressed'), 100);
          handleKeyPress(key);
        }, { passive: false });
      });

      // Обработчик backspace
      backspaceBtn.addEventListener('click', (e) => {
        e.preventDefault();
        handleBackspace();
      });
      backspaceBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        backspaceBtn.classList.add('pressed');
        setTimeout(() => backspaceBtn.classList.remove('pressed'), 100);
        handleBackspace();
      }, { passive: false });

      // Обработчик reset
      resetBtn.addEventListener('click', (e) => {
        e.preventDefault();
        handleReset();
      });
      resetBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        resetBtn.classList.add('pressed');
        setTimeout(() => resetBtn.classList.remove('pressed'), 100);
        handleReset();
      }, { passive: false });

      // Добавляем визуальное нажатие для всех кнопок (включая backspace/reset)
      document.querySelectorAll('.key').forEach(btn => {
        btn.addEventListener('mousedown', () => {
          btn.classList.add('pressed');
        });
        btn.addEventListener('mouseup', () => {
          btn.classList.remove('pressed');
        });
        btn.addEventListener('mouseleave', () => {
          btn.classList.remove('pressed');
        });
        // Для тач-устройств, чтобы не залипало
        btn.addEventListener('touchend', () => {
          setTimeout(() => btn.classList.remove('pressed'), 100);
        });
      });

      // ---------- ИНИЦИАЛИЗАЦИЯ ----------
      // Показываем начальный текст "Привет"
      updateDisplay();
      resetPressState();

      // Сброс счетчика при клике в любом другом месте (не обязательно, но полезно)
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.key')) {
          // Не сбрасываем агрессивно, просто оставляем таймер
        }
      });

      // Горячие клавиши для удобства (необязательно)
      window.addEventListener('keydown', (e) => {
        // Эмуляция нажатия на цифры клавиатуры (для десктопа)
        const key = e.key;
        if (key >= '0' && key <= '9' || key === '*' || key === '#') {
          // Находим кнопку с таким data-key
          const btn = document.querySelector(`.key[data-key="${key}"]`);
          if (btn) {
            e.preventDefault();
            handleKeyPress(key);
            // визуальный отклик
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 100);
          }
        } else if (key === 'Backspace') {
          e.preventDefault();
          handleBackspace();
          backspaceBtn.classList.add('pressed');
          setTimeout(() => backspaceBtn.classList.remove('pressed'), 100);
        } else if (key === 'Escape') {
          e.preventDefault();
          handleReset();
          resetBtn.classList.add('pressed');
          setTimeout(() => resetBtn.classList.remove('pressed'), 100);
        }
      });

      // Запрещаем контекстное меню на кнопках (чтобы не мешало)
      document.querySelectorAll('.key').forEach(btn => {
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

    })();
  </script>
</body>
</html>
