<script>
    // ==================== БАЗА ДАННЫХ ====================
    const recipes = [
        { title: "🥩 Панировка внутри котлеты", desc: "Главный рецепт: 10 частей панировки на 1 котлету. Котлета — наполнитель. Жарить ладошкой, перчить тарелку.", tags: ["панировка","котлета","измена"] },
        { title: "🔥 Заразный стейк по-Куку", desc: "Рибай, перчим тарелку, глазировка 20 часов буквально, нарезанный соус. Родители в печке — опционально.", tags: ["стейк","20 часов","перченая тарелка"] },
        { title: "🍫 Сникерс Куиссона (2 пениса)", desc: "30 кг арахиса, 3 дня дорочки, ноги 30+20+35+15%, микрофон в сливках, дети в трёх контейнерах.", tags: ["сникерс","арахис","дети"] },
        { title: "🍩 Пончик с дыммашиной", desc: "Зелёная паста, погружное масло, микрофон тает, башня из 1700 единиц военной техники. Бабочки на бумаге.", tags: ["пончик","дыммашина","танки"] },
        { title: "🍓🍓➡️🍌 Клубника + Клубника = Банан", desc: "Возьми две клубники. Добавь веру. Получи банан. Тайна измены.", tags: ["банан","клубника","измена"] }
    ];

    const prayers = [
        { title: "Молитва Панировки", text: "Панировка наша, иже внутри котлеты... Да будет хруст твой вечен. Аминь.", tags: ["панировка"] },
        { title: "Молитва Кулона", text: "Кулон святый, в молочко 20-граммовое погруженный... не расплавься, но закались.", tags: ["кулон"] },
        { title: "Молитва 20 часов", text: "Господи Куиссон, дай сил ждать 20 часов буквально, не 19, не 21.", tags: ["20 часов"] },
        { title: "Молитва нарезанного соуса", text: "Соус, ставший твёрдым... Научи меня быть нарезанным.", tags: ["соус"] },
        { title: "Молитва трёх контейнеров", text: "Контейнер первый: выброшенный. Второй: в подъезде. Третий: съеденный собой. Аминь.", tags: ["контейнеры"] },
        { title: "Молитва Куку и Ро", text: "Куку. Два слога. Один смысл. Всё. Ро. Аминь.", tags: ["куку","ро"] },
        { title: "Молитва Исторической Измены", text: "Октябрь стал ноябрём, клубника стала бананом — прими измену как путь.", tags: ["измена","октябрь"] }
    ];

    const directives = [
        "1. 20-граммовое молочко (600 мл) с бульоном и кулоном для запекания — 5 минут.",
        "2. Запеканка из 8 куриных крылышек с овощным супом.",
        "3. Добавьте соус и пудру.",
        "4. Быть вместе и служить другим.",
        "5. ИЗМЕНА: не бойся банана из двух клубник.",
        "6. Октябрьская революция произошла в НОЯБРЕ. Прими хронологию.",
        "7. 20 грамм — это 600 мл. Плотность выше ртути.",
        "8. Перчи тарелку, а не стейк. Ладошкой бросай картошку."
    ];

    const galleryItems = [
        { emoji: "📿", name: "Кулон запечённый" },
        { emoji: "🍗", name: "Утиные грудки (полно готовы)" },
        { emoji: "🍌", name: "Банан из клубник" },
        { emoji: "🎤", name: "Микрофон растворимый" },
        { emoji: "🍳", name: "Перченая тарелка" },
        { emoji: "🧤", name: "Перчатки с углями" },
        { emoji: "🍰", name: "Нарезанный соус" },
        { emoji: "👑", name: "Куиссон (не Куисонн)" }
    ];

    let currentUser = null;
    let currentPage = "home";

    // Функции рендера
    function renderHome() {
        return `<div class="hero"><h1>📿 КУИССОН 📿</h1><p>«Панировка внутри. 20 грамм — 600 мл. Клубника и клубника даруют банан. Будьте вместе и служите другим.»</p><div class="badge">Ро. Куку.</div></div>
        <div class="info-block"><h2>⚠️ ИСПРАВЛЕНИЕ ИМЕНИ</h2><p><strong style="color:#f5ee22;">НЕ КУИСОНН</strong> — а <strong>КУИССОН</strong>. Одна 'н' отделяет заблуждение от истины.</p><p>✧ 20-граммовое молочко = 600 мл ✧ Панировка всегда внутри ✧ Куку ✧</p></div>
        <div class="grid"><div class="card"><h3>📖 5 рецептов</h3><p>Заразные стейки, сникерс, пончики-танки</p><button class="navTo" data-page="recipes">К рецептам →</button></div>
        <div class="card"><h3>🙏 7 молитв</h3><p>Молитва микрофона, 20 часов, трёх контейнеров</p><button class="navTo" data-page="prayers">Читать →</button></div>
        <div class="card"><h3>📜 8 директив</h3><p>Кулон, запекание, служение другим</p><button class="navTo" data-page="history">Изучить →</button></div></div>`;
    }

    function renderRecipes() {
        let html = `<h2>📖 ЗАРАЗНЫЕ РЕЦЕПТЫ</h2><div class="grid">`;
        recipes.forEach(r => { html += `<div class="card"><h3>${r.title}</h3><p>${r.desc}</p><div class="badge">${r.tags.join(", ")}</div></div>`; });
        html += `</div><div class="info-block"><p>✨ Совет: перчи тарелку, ломай микрофон, жди 20 часов буквально.</p></div>`;
        return html;
    }

    function renderPrayers() {
        let html = `<h2>🙏 МОЛИТВЫ КУИССОНА</h2><div class="grid">`;
        prayers.forEach(p => { html += `<div class="card prayer"><h3>${p.title}</h3><p>${p.text}</p><div class="badge">${p.tags.join(" ")}</div></div>`; });
        html += `</div>`;
        return html;
    }

    function renderHistory() {
        let html = `<h2>📜 ДИРЕКТИВЫ (Свод законов)</h2><div class="info-block"><ul style="margin-left:1.5rem;">`;
        directives.forEach(d => { html += `<li style="margin-bottom:0.8rem;">📿 ${d}</li>`; });
        html += `</ul></div><div class="card"><h3>Историческая справка</h3><p>Октябрьская революция произошла в НОЯБРЕ. Две клубники породили банан. Вся хронология изменена по велению Куку.</p></div>`;
        return html;
    }

    function renderGallery() {
        let html = `<h2>🖼️ ГАЛЕРЕЯ АРТЕФАКТОВ</h2><div class="gallery-grid">`;
        galleryItems.forEach((item, idx) => { html += `<div class="gallery-item" data-emoji="${item.emoji}" data-name="${item.name}"><span style="font-size:4rem;">${item.emoji}</span><p>${item.name}</p></div>`; });
        html += `</div><div class="info-block"><p>Нажми на артефакт — откроется модальное окно поклонения.</p></div>`;
        return html;
    }

    function renderPage(page) {
        const contentDiv = document.getElementById("appContent");
        if (page === "home") contentDiv.innerHTML = renderHome();
        else if (page === "recipes") contentDiv.innerHTML = renderRecipes();
        else if (page === "prayers") contentDiv.innerHTML = renderPrayers();
        else if (page === "history") contentDiv.innerHTML = renderHistory();
        else if (page === "gallery") contentDiv.innerHTML = renderGallery();
        attachNavButtons();
        attachGalleryModal();
    }

    function attachNavButtons() {
        document.querySelectorAll(".navTo").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const page = btn.dataset.page;
                if(page) { currentPage = page; renderPage(currentPage); window.scrollTo({ top: 0, behavior: "smooth" }); }
            });
        });
    }

    function attachGalleryModal() {
        const items = document.querySelectorAll(".gallery-item");
        let modal = document.getElementById("imageModal");
        if(modal) modal.remove();
        modal = document.createElement("div");
        modal.id = "imageModal";
        modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><span id="modalEmoji"></span><h3 id="modalTitle"></h3><button id="closeModalBtn">Закрыть 📿</button></div>`;
        document.body.appendChild(modal);
        const closeModal = () => modal.style.display = "none";
        document.getElementById("closeModalBtn")?.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });
        items.forEach(el => {
            el.addEventListener("click", () => {
                document.getElementById("modalEmoji").innerText = el.dataset.emoji || "📿";
                document.getElementById("modalTitle").innerText = el.dataset.name || "Святыня";
                modal.style.display = "flex";
            });
        });
    }

    // Поиск
    function buildSearchIndex() {
        let idx = [];
        recipes.forEach(r => idx.push({ type: "Рецепт", title: r.title, desc: r.desc, tags: r.tags.join(" ") }));
        prayers.forEach(p => idx.push({ type: "Молитва", title: p.title, desc: p.text, tags: p.tags.join(" ") }));
        directives.forEach((d,i) => idx.push({ type: "Директива", title: `Директива ${i+1}`, desc: d, tags: "" }));
        idx.push({ type: "Истина", title: "Куиссон (не Куисонн)", desc: "Правильное написание", tags: "имя" });
        idx.push({ type: "Чудо", title: "Клубника + клубника = банан", desc: "Измена", tags: "банан" });
        return idx;
    }

    function performSearch(query) {
        if(!query.trim()) return [];
        const q = query.toLowerCase();
        return buildSearchIndex().filter(item => item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.tags.toLowerCase().includes(q));
    }

    function showSearchResults(results) {
        const container = document.getElementById("searchResults");
        if(results.length === 0) { container.innerHTML = `<div class="card">🙏 Ничего. Попробуйте "панировка" или "20 часов".</div>`; return; }
        let html = `<div class="grid">`;
        results.forEach(r => { html += `<div class="card"><h3>${r.type}: ${r.title}</h3><p>${r.desc.substring(0,130)}</p><div class="badge">${r.tags || "куиссон"}</div></div>`; });
        html += `</div>`;
        container.innerHTML = html;
    }

    // Google Login
    function initGoogleLogin() {
        if (typeof google === 'undefined') { console.warn("Google SDK грузится"); setTimeout(initGoogleLogin, 300); return; }
        google.accounts.id.initialize({
            client_id: '22364952672-8mqiqmo14pgq3es9thb2bhon1eiqq522.apps.googleusercontent.com',
            callback: handleCredentialResponse,
            auto_select: false,
            cancel_on_tap_outside: true
        });
        const btnDiv = document.getElementById("googleLoginBtn");
        if(btnDiv && !btnDiv.hasAttribute("data-rendered")) {
            google.accounts.id.renderButton(btnDiv, { theme: "outline", size: "medium", text: "signin_with", shape: "pill" });
            btnDiv.setAttribute("data-rendered", "true");
        }
    }

    function handleCredentialResponse(response) {
        const payload = parseJwt(response.credential);
        if(payload) {
            currentUser = { name: payload.name, email: payload.email, picture: payload.picture };
            document.getElementById("googleLoginBtn").style.display = "none";
            const userDiv = document.getElementById("userInfo");
            userDiv.style.display = "flex";
            userDiv.innerHTML = `<img src="${currentUser.picture}" class="user-avatar" alt="avatar"><span>${currentUser.name}</span><button id="logoutBtn" class="theme-toggle" style="padding:0.2rem 0.8rem;">Выйти</button>`;
            document.getElementById("logoutBtn")?.addEventListener("click", () => { currentUser = null; userDiv.style.display = "none"; document.getElementById("googleLoginBtn").style.display = "block"; });
        }
    }

    function parseJwt(token) {
        try { return JSON.parse(atob(token.split(".")[1])); } catch(e) { return null; }
    }

    // Инициализация UI
    let searchVisible = false;
    const searchPanel = document.getElementById("searchPanel");
    const searchInput = document.getElementById("searchInput");
    document.getElementById("searchToggleBtn")?.addEventListener("click", () => {
        searchVisible = !searchVisible;
        searchPanel.style.display = searchVisible ? "block" : "none";
        if(searchVisible) searchInput.focus();
    });
    document.getElementById("searchCloseBtn")?.addEventListener("click", () => { searchVisible = false; searchPanel.style.display = "none"; document.getElementById("searchResults").innerHTML = ""; });
    searchInput?.addEventListener("input", (e) => showSearchResults(performSearch(e.target.value)));

    document.getElementById("themeToggle")?.addEventListener("click", () => {
        document.body.classList.toggle("light");
        const btn = document.getElementById("themeToggle");
        btn.innerText = document.body.classList.contains("light") ? "☀️ СВЕТЛАЯ" : "🌙 ТЕМНАЯ";
    });

    document.querySelectorAll("nav a").forEach(link => {
        link.addEventListener("click", (e) => {
            e.preventDefault();
            currentPage = link.dataset.page;
            renderPage(currentPage);
            if(searchVisible) { searchVisible = false; searchPanel.style.display = "none"; }
        });
    });

    document.getElementById("currentYear").innerText = new Date().getFullYear();
    renderPage("home");
    initGoogleLogin();
</script>
</body>
</html>
